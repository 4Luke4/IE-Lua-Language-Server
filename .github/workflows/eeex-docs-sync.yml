# Reusable: refreshes data/eeex/<section>.json when the published EEex
# documentation for that section changes, and opens a pull request.
# Called by eeex-docs-sync-*.yml (one per documentation section).
#
# "New stable release": upstream (Bubb13/EEex-Docs) has no tags or releases, so
# the newest *successful* Read the Docs build of `latest` is the release. The
# first step costs two small API calls and ends the job when nothing changed.
# No `npm ci`: scripts/eeex-docs/ only uses Node.js built-ins.
name: EEex docs sync (reusable)

on:
  workflow_call:
    inputs:
      section:
        description: eeex-functions | game-lua-functions | game-structures-x64
        type: string
        required: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync ${{ inputs.section }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the update branch
      pull-requests: write # open the pull request
      actions: write # start CI on the branch
    concurrency:
      group: eeex-docs-sync-${{ inputs.section }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: check
        name: Check upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECTION: ${{ inputs.section }}
        run: node scripts/eeex-docs/sync.mts "$SECTION" --check
      - name: Regenerate data
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECTION: ${{ inputs.section }}
        run: node scripts/eeex-docs/sync.mts "$SECTION"
      - name: Open or update pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECTION: ${{ inputs.section }}
          SOURCE_COMMIT: ${{ steps.check.outputs.source_commit }}
        run: |
          if git diff --quiet -- "data/eeex/$SECTION.json"; then
            echo "Upstream changed, but the generated data is identical; nothing to do."
            exit 0
          fi
          branch="eeex-docs/$SECTION"
          short="${SOURCE_COMMIT:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "data/eeex/$SECTION.json"
          git commit -m "chore(data): update $SECTION from EEex-Docs $short"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "chore(data): update $SECTION from EEex-Docs $short" --body \
              "The published EEex documentation for \`$SECTION\` changed (upstream commit [$short](https://github.com/Bubb13/EEex-Docs/commit/$SOURCE_COMMIT)). This pull request updates the generated names and links in \`data/eeex/$SECTION.json\`. Generated by the EEex docs sync workflow."
          fi
          # Pull requests opened with GITHUB_TOKEN do not trigger `pull_request`
          # workflows; start the required checks on the branch explicitly.
          gh workflow run ci.yml --ref "$branch"
          gh workflow run commitlint.yml --ref "$branch"
