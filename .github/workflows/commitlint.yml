# Enforces Conventional Commits 1.0.0 (commitlint.config.mjs, .gitmessage) on
# every commit of a pull request and on its title (the squash-merge message).
# Dependabot pull requests are exempt.
name: Commit messages

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Used by automation for branches whose pull requests it opened itself.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Conventional Commits
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$FROM" ]; then
            # Manual run on a branch: everything not yet on main.
            git fetch --no-tags origin main
            FROM="$(git merge-base origin/main HEAD)"
            TO=HEAD
          fi
          npx commitlint --from "$FROM" --to "$TO" --verbose
      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint --verbose
