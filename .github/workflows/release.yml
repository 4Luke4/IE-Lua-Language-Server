# Two-step release (private: VSIX files are attached to GitHub releases only;
# nothing is ever published to a marketplace).
#
# 1. "Run workflow" (choose pre-release or stable) → job `prepare`:
#    computes the next version from git tags + Conventional Commits
#    (scripts/release/), updates VERSION, package.json, package-lock.json,
#    CHANGELOG.md and docs/CHANGELOG.vsix.md, and opens a release pull request.
# 2. Merging that pull request changes VERSION on main → job `publish`
#    (environment `release`): verifies the version, runs the checks, packages the
#    VSIX and creates the tag and the GitHub (pre-)release.
#
# Version rules (VS Code): plain major.minor.patch; even minor = stable,
# odd minor = pre-release (packaged with `vsce package --pre-release`).
name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [pre-release, stable]
        required: true
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.channel }} release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release branch
      pull-requests: write # open the release pull request
      actions: write # start CI on the release branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # all tags and commits since the last release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - id: version
        name: Compute version and update files
        env:
          CHANNEL: ${{ inputs.channel }}
        run: node scripts/release/cli.mts prepare --channel "$CHANNEL"
      - name: Open release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          branch="release/$TAG"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::error title=Release::Branch $branch already exists. Merge or close its pull request first."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add VERSION package.json package-lock.json CHANGELOG.md docs/CHANGELOG.vsix.md
          git commit -m "chore(release): $TAG"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(release): $TAG" --body \
            "Prepares the **$CHANNEL** release **$TAG**. Merging this pull request publishes the GitHub release with the VSIX attached. Generated by the Release workflow."
          # Pull requests opened with GITHUB_TOKEN do not trigger `pull_request`
          # workflows; start the required checks on the branch explicitly.
          gh workflow run ci.yml --ref "$branch"
          gh workflow run commitlint.yml --ref "$branch"

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - id: version
        name: Verify version
        run: node scripts/release/cli.mts verify --notes "$RUNNER_TEMP/notes.md"
      - name: Checks
        run: |
          npm run check-types
          npm run lint
          npm run test:unit
          npm run check-l10n
      - name: Production bundle
        run: npm run package
      - name: Third-party notices are current
        run: npm run notices -- --check
      - name: Package VSIX
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          flags=()
          if [ "$CHANNEL" = "pre-release" ]; then flags+=(--pre-release); fi
          npx vsce package --no-dependencies --changelog-path docs/CHANGELOG.vsix.md "${flags[@]}" \
            --out "ie-lua-language-server-$VERSION.vsix"
          sha256sum "ie-lua-language-server-$VERSION.vsix" | tee "ie-lua-language-server-$VERSION.vsix.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          flags=()
          if [ "$CHANNEL" = "pre-release" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" \
            "ie-lua-language-server-$VERSION.vsix" "ie-lua-language-server-$VERSION.vsix.sha256"
